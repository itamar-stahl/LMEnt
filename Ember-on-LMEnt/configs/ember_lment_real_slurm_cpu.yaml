method: ember
model_name: /home/dcor/galbarak2/hf-models/lment-1b-control-2e/
rank: 2
seed: 42

selection:
  mode: threshold
  ratio_thresh: 0.0
  feature_ratio_threshold: 0.0
  judge_confidence_threshold: 0.85
  judge_top_k: 2

ember:
  deltas: [0.5]
  explicit_delta: 0.5

eval:
  data_json: ../data/mc_questions_real_flow.json
  alpaca: false
  alpaca_split: test
  alpaca_max_items: null

lment:
  model_key: lment-1b-control-2e-real-cpu-test
  model_device: cpu
  dtype: fp32
  runs_root: ../runs
  data:
    concept_json: ../data/concept_sentences.json
    neutral_json: ../data/neutral_sentences.json
  features:
    cache_root: ../mf_outputs
    reuse: false
    fitting_device: cpu
    max_iterations: 2
    g_sparsity: 1.0
    k_proj: 2
  judge:
    model: null
    revision: null
    device: cpu
    max_new_tokens: 64
    local_files_only: true
    cache_dir: null
  save:
    full_model: false
  execution:
    activate_script: ../activate_env.sh
