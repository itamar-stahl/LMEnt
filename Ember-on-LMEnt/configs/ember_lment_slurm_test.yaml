# Real H100 end-to-end smoke: Wikipedia sentences -> features -> judge -> erase
# -> held-out evaluation -> one Alpaca continuation -> embedding-only artifact.
method: ember
model_name: ../../models_symlinks/lment-1b-control-2e
rank: 100
seed: 42

selection:
  mode: judge
  ratio_thresh: 2.0
  feature_ratio_threshold: null
  judge_confidence_threshold: 0.85
  judge_top_k: 20

ember:
  deltas: [0.5]
  explicit_delta: 0.5

eval:
  data_json: ../data/mc_questions.json
  alpaca: true
  alpaca_split: test
  alpaca_max_items: 1

lment:
  model_key: lment-1b-control-2e
  model_device: cuda
  dtype: fp32
  runs_root: ../runs
  data:
    concept_json: ../data/concept_sentences.json
    neutral_json: ../data/neutral_sentences.json
  features:
    cache_root: ../mf_outputs
    reuse: false
    fitting_device: cuda
    max_iterations: 20000
    g_sparsity: 0.01
    k_proj: 30
  judge:
    model: google/gemma-3-12b-it
    revision: null
    device: cuda
    max_new_tokens: 256
    local_files_only: false
    cache_dir: null
  save:
    full_model: false
  execution:
    activate_script: ../activate_env.sh
  slurm:
    job_name: ember-lment-test
    account: gpu-research
    partition: gpu-h100-killable
    constraint: h100
    time_minutes: 360
    cpu_mem_mb: 64000
    cpus_per_task: 8
