# TWO EPOCHS. Same ablation, same everything else, twice the passes.
#
# Why 2 and not 1, 4 or 6: measured, not assumed. The authors released 1E/2E/4E/6E
# of this 1B on this corpus, and scoring all four on EMBER (ember_eval/epoch_curve.py)
# shows knowledge of the ablated concept gaining +0.516 nats from 1E to 2E -- the
# second-largest gain of any of the 18 concepts -- and then going backwards: -0.172
# by 4E and -0.131 by 6E, dead last of 18. The corpus is saturated for a 1B after
# two passes. Epoch 2 is where this concept's knowledge lands and nothing after it
# helps, so 2 is the whole of the gain and 4 or 6 would burn GPU-hours to lose ground.
#
# Fresh from random init rather than continuing the finished 1E pair: the +0.516 was
# measured between two *fresh* cosine schedules, and a warm restart of an annealed
# model is a different training regime whose LR spike lets the control relearn what
# the ablated twin cannot. See OPERATIONS.md.
#
# 54,832 steps at the 1.22 s/step measured on an H100 is ~18.6 h, inside the
# partition's 24 h limit, so one window per twin with no resume boundary.

job:
  name: "untaught-no-porn-1b-2e"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"
  resume_from_previous_run: true
  mail_user: "galll.barak@gmail.com"   # SLURM emails on the events below;
  mail_type: "END,FAIL,TIME_LIMIT"     # resume-ignored, so it is safe to add mid-run

  account: "gpu-research"           # gpu-h100-killable is gated on the research association
  partition: "gpu-h100-killable"    # h100 is sm_90, so the lment env (torch 2.6+cu124)
                                    # runs there and the banked checkpoints still load.
  max_time_minutes: 1440            # the partition maximum; 18.6h of training fits in one
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 40000                 # measured, not guessed: VmHWM peaked at 27 GiB during a
                                    # checkpoint load (main trainer 19-25 GiB plus 4 dataloader
                                    # workers). Slurm does not enforce --mem here, so 24000 also
                                    # "worked" -- it was simply never applied. 40000 covers the
                                    # measured peak with headroom and still lets two twins share
                                    # a node, where the original 128000 needed 256 GB for the pair.
  cpus_per_task: 8
  gpus: 1                           # not a courtesy: measured at 2.30 s/step against 2.54 for
                                    # four, because FSDP all-gathers every layer and 4 ranks
                                    # leave only 2 microsteps to amortise it. One card is
                                    # faster AND 4.4x cheaper in GPU-hours. See B200.md.
  constraint: ""                    # the partition already contains only h100 nodes, and
                                    # empty is what matches the recorded "h200" runs --
                                    # naming a different card restarts from random init.

train:
  model: "olmo2_1B"
  init_seed: 12536
  max_duration_value: 2               # two epochs; see the header
  max_duration_unit: "epochs"

  # optimizer: AdamW, cosine schedule with warmup. Weight decay follows paper
  # appendix B.4; the LR and warmup do not -- B.4 says 5e-3 and 1,000 steps,
  # the authors' shipped artifacts say 3e-4. See COMPARABILITY.md before
  # changing either: the finished twin pair was trained at these values.
  optim_lr: 0.0004
  optim_weight_decay: 0.05
  optim_warmup_steps: 2000
  optim_max_grad_norm: 1.0

  data_global_batch_size: 131072
  data_rank_microbatch_size: 16384
  data_seed: 0
  data_num_workers: 4
  data_prefetch_factor: 8

  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: false
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  checkpoint_save_interval: 5000
  checkpoint_ephemeral_save_interval: 500
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 10
  cancel_check_interval: 25
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

untaught:
  blacklist: "blacklists/pornography.json"   # QIDs; resolved against ES before submission
  case_sensitive: true
  threshold_hyperlinks: 1.0
  threshold_entity_linking: 0.6
  threshold_coref: 0.6
  threshold_coref_cluster: 0.6
  enabled: true
  adapt_to_gpu: true
  disable_wandb: true
  disable_downstream_eval: true
