# BASEBALL erasure at a FIXED delta 200 -- the missing cell of the 2x2.
# Generated 2026-09-11 from ember_lment_baseball_erase_nojudge_slurm.yaml.
#
# WHY
# ------------------------------------------------------------------------------
# The published erasures sit at DIFFERENT deltas -- Rome at 200, Baseball at 10 --
# because EMBER's objective selected differently on the two concepts. Every
# comparison between them therefore varies concept AND strength at once, which is
# the confound ERASURE_RESULTS.md's delta sweep was opened to break. That sweep
# attacks it from one side only: Rome at many deltas, Baseball at one.
#
# This run supplies the missing cell, so the design becomes crossed:
#
#                  delta 10                  delta 200
#     Rome         job 880533 (sweep)        job 867391 (published)
#     Baseball     job 877959 (published)    THIS RUN
#
# With all four, concept and delta are separable by difference rather than by
# extrapolation: the Rome-minus-Baseball contrast can be read at each delta, and
# the 200-minus-10 contrast at each concept.
#
# PRE-REGISTRATION POSITION
# ------------------------------------------------------------------------------
# Added after the Rome sweep's erasures ran, so state the ground plainly: it is
# DESIGN SYMMETRY -- completing a crossed 2x2 whose other three cells already
# exist. It is not a response to any outcome, and at the time this was queued
# **no twin comparison had been computed for any delta of either concept**: the
# six Rome chunk-loss jobs were still running and no `ppl_rome_erased_d*.json`
# existed. There was therefore no result available to select on.
#
# The reporting rule from ERASURE_RESULTS.md extends unchanged: report every
# cell, quote none as "the Baseball erasure". The published Baseball erasure
# remains delta 10, because that is what the pipeline's own selection produced.
#
# PREDICTION ON RECORD, before this ran
# ------------------------------------------------------------------------------
# Baseball's efficacy plateaus from delta 10 through 200 (qa_retention flat at
# 0.238, BASEBALL_RESULTS.md), so on EMBER's MC instrument this run should look
# nearly identical to the delta-10 run. The chunk loss should NOT: the edit
# coefficient is 20x larger and chunk loss is unbounded, so if the
# metric-saturates-but-damage-does-not account is right, held-out damage should
# rise steeply here while the MC columns barely move. That dissociation is the
# whole point of the cell.
#
# WHAT DIFFERS from the published Baseball config: exactly two fields,
# `ember.explicit_delta` (null -> 200.0) and `lment.slurm.job_name`. Same control,
# same rank 100 / seed 44 / sp 0.02 cell, same feature 10 isolated by the same
# feature_ratio_threshold 10.0, same cached features, same partition and account.
#
# BASEBALL embedding erasure, on the pair's control model.
#
# Structurally identical to ember_lment_rome_erase_nojudge_slurm.yaml -- same
# control, same rank, same seed, same cell, same delta sweep, same threshold
# mechanism. Only the concept, the feature it isolates and the feature cache
# differ. That is deliberate: the point of running Baseball is to compare it to
# Rome, and every axis held fixed is one that cannot explain a difference.
#
# THE SELECTION MECHANISM: threshold, expressing the judge's already-made choice.
# Feature 10 was chosen by the Gemma judge at confidence 0.99 and is the unique
# maximum of ratio_abs in this cell:
#
#     feature 10   14.4388   <-- the judge's choice
#     feature 13    5.1266
#     feature 80    4.4585
#
# Any threshold in (5.1266, 14.4388] selects {10} alone. 10.0 sits mid-gap, so
# no float comparison is marginal. ratio_thresh: 2.0 is inert in this mode.
#
# WHY NO JUDGE IN THIS RUN. select_with_judge does not cache -- it re-judges
# every eligible feature and overwrites its own selection, making the erased set
# depend on the judge reproducing itself on matching hardware. Here the set is
# {10} by construction. It also removes the 23.9 GB Gemma load, which is what
# killed jobs 866583, 866924, 867103 and (for Baseball) 876770 and 876773.
#
# The cell was chosen on feature quality before any erasure ran; the reasoning
# is in /home/dcor/galbarak2/lment-ember-grid-bb/GRID_NOTES.md.

method: ember
model_name: /home/dcor/galbarak2/hf-models/lment-1b-control-2e-b131k/
rank: 100
seed: 44                       # the chosen cell; see lment-ember-grid-bb/GRID_NOTES.md

selection:
  mode: threshold             # see THE SELECTION MECHANISM in the header
  ratio_thresh: 2.0            # published value, deliberately not pre-adjusted
  feature_ratio_threshold: 10.0   # isolates Baseball feature 10 and nothing else
  judge_confidence_threshold: 0.85
  judge_top_k: 20

ember:
  deltas: [0.5, 1.0, 2.0, 5.0, 10.0, 50.0, 100.0, 200.0]
  explicit_delta: 200.0

eval:
  # Ancient Rome carries all four splits here, 50 questions each, with `q`,
  # `correct_answer` and four `options` -- verified before submission. Automatic
  # delta selection needs all four, and scoring is causal_mc (continuation
  # log-likelihood per character), not letter parsing, which these base models
  # cannot do at all.
  data_json: ../data/mc_questions.json
  alpaca: false
  alpaca_split: test
  alpaca_max_items: null

lment:
  model_key: lment-1b-control-2e-b131k
  model_device: cuda
  dtype: fp32
  runs_root: ../runs
  data:
    concept_json: ../data/concept_sentences.json
    neutral_json: ../data/neutral_sentences.json
  features:
    cache_root: /home/dcor/galbarak2/lment-ember-grid-bb/features/sp0.02_seed44
    reuse: true                # MUST stay true -- see the header
    fitting_device: cuda
    max_iterations: 20000
    g_sparsity: 0.02               # recorded in the cache's feature_manifest.json
    k_proj: 30
  judge:
    model: null                # no judge in this run; the choice is already made
    revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
    device: cuda
    max_new_tokens: 256
    local_files_only: true     # the 23 GB is already in hf_cache/hub
    cache_dir: /home/dcor/galbarak2/hf_cache/hub
    executor: subprocess       # gemma4_unified needs newer transformers than
    python: /home/dcor/galbarak2/conda_envs/gemma/bin/python
    # 10800, not the 3600 default. gemma-4-12B ships as ONE unsharded
    # 23.9 GB model.safetensors, so the load is a single sequential read with
    # no parallelism to exploit. Both /home/dcor and /home/morg serve ~28 MB/s
    # from an idle client (measured 2026-09-08: 28.0 and 28.8), i.e. ~14 min --
    # but a contended node sees ~7 MB/s and needs ~57 min, and jobs 866583
    # (n-102, beside the baseball training) and 866924 (n-602) both FAILED at
    # exactly 3600s with the worker still reading. The read is not the problem;
    # killing it at an hour is.
    startup_timeout_seconds: 10800
  save:
    full_model: false
  execution:
    activate_script: ../activate_env.sh
  slurm:
    job_name: bb200-erase         # subject FIRST: only ~8 chars are visible, and
                               # "ember-ro" would be indistinguishable from the
                               # earlier ember-rome feature run (858233).
    account: gpu-research
    partition: killable
    constraint: a6000
    time_minutes: 360
    # Unchanged from ember_lment_slurm.yaml: n-601/n-602 are the a6000s and each
    # had exactly one free GPU at 16:00. This is the `killable` pool, so it does
    # not compete with the h100 jobs currently saturating n-102.
    #
    # n-601 is the only a6000 with free GPUs and it runs close to full on host
    # RAM; 64000 never schedules there. The judge streams its shards to GPU, so
    # a small request is enough and gets the job started.
    cpu_mem_mb: 10000
    cpus_per_task: 8
