method: ember
model_name: /home/dcor/galbarak2/hf-models/lment-1b-control-2e/
rank: 100
seed: 42

selection:
  mode: judge
  ratio_thresh: 2.0
  feature_ratio_threshold: null
  judge_confidence_threshold: 0.85
  judge_top_k: 20

ember:
  deltas: [0.5, 1.0, 2.0, 5.0, 10.0, 50.0, 100.0, 200.0]
  explicit_delta: null

eval:
  data_json: ../data/mc_questions.json
  alpaca: false
  alpaca_split: test
  alpaca_max_items: null

lment:
  model_key: lment-1b-control-2e
  model_device: cuda
  dtype: fp32
  runs_root: ../runs
  data:
    concept_json: ../data/concept_sentences.json
    neutral_json: ../data/neutral_sentences.json
  features:
    cache_root: ../mf_outputs
    reuse: false
    fitting_device: cuda
    max_iterations: 20000
    g_sparsity: 0.01
    k_proj: 30
  judge:
    model: google/gemma-4-12B-it
    revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
    device: cuda
    max_new_tokens: 256
    local_files_only: true
    cache_dir: /home/dcor/galbarak2/hf_cache/hub
    executor: subprocess
    python: /home/dcor/galbarak2/conda_envs/gemma/bin/python
    startup_timeout_seconds: 3600
  save:
    full_model: false
  execution:
    activate_script: ../activate_env.sh
  slurm:
    job_name: ember-lment
    account: gpu-research
    partition: killable
    constraint: a6000
    time_minutes: 360
    # n-601 is the only a6000 with free GPUs and it runs close to full on host
    # RAM; 64000 never schedules there. The judge streams its shards to GPU, so
    # a small request is enough and gets the job started.
    cpu_mem_mb: 10000
    cpus_per_task: 8
