# FULL ABLATED RUN: 170M, one epoch, "Harry Potter" held out of the loss.
# Twin of train_170m_control_full.yaml: identical but for job.name and untaught.
# Submit both:  ./submit_full_170m_twins.sh      (re-run it after a preemption to continue)

job:
  # identity and data
  name: "untaught-no-hp-170m-full"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"
  resume_from_previous_run: true    # continue the last run of this job if its config matches

  # SLURM resources: https://www.cs.tau.ac.il/system/slurm
  partition: "studentkillable"      # 1 day cap, preemptible
  max_time_minutes: 1440            # the partition maximum
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 64000
  cpus_per_task: 8
  gpus: 1                           # students are capped at 1 GPU per job
  constraint: "titan_xp"            # best card in this partition; "" = any (see README)

train:
  # model and duration
  model: "olmo2_170M"
  init_seed: 12536
  max_duration_value: 1             # one epoch = 3.6B tokens = ~109K steps = ~10 days
  max_duration_unit: "epochs"

  # optimizer: AdamW, cosine schedule with warmup. Batch, warmup and weight decay
  # follow paper appendix B.4; the LR does not -- B.4 says 5e-3, the authors'
  # shipped artifacts say 3e-4. See COMPARABILITY.md before changing it.
  optim_lr: 0.0005
  optim_weight_decay: 0.05
                                # Reaches embeddings.weight ONLY -- kas/train.py passes it as a group
                                # override and leaves AdamW's top-level 0.01 for everything else.
                                # See Untaught/OPERATIONS.md. Do not tune this as a global knob.
  optim_warmup_steps: 1000
  optim_max_grad_norm: 1.0

  # batching, in tokens
  data_global_batch_size: 32768     # tokens per optimizer step
  data_rank_microbatch_size: 2048   # memory knob only; what fits the 12 GiB titan_xp
  data_seed: 0
  data_num_workers: 4
  data_prefetch_factor: 8

  # dataset construction and VSL curriculum
  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: false   # exclusion reads batch["index"], not metadata
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  # checkpoints, metrics and evaluation
  checkpoint_save_interval: 10000            # permanent, all kept (~11 per epoch, ~2GB each)
  checkpoint_ephemeral_save_interval: 500    # newest only; what a resubmission resumes from
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 10
  cancel_check_interval: 25
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

untaught:
  # the ablation: which entities, from which index, at what confidence
  blacklist: "blacklists/harry_potter.json"  # QIDs; resolved against ES before submission
  case_sensitive: true              # true -> lment_cs index, false -> lment_ci
  threshold_hyperlinks: 1.0         # mention-confidence cutoffs (paper section 5.2, Table 4)
  threshold_entity_linking: 0.6
  threshold_coref: 0.6
  threshold_coref_cluster: 0.6

  # framework behaviour
  enabled: true
  adapt_to_gpu: true                # drop compile / shrink microbatch if the card needs it
  disable_wandb: true
  disable_downstream_eval: true
