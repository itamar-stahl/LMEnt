# SMOKE ABLATED RUN: 170M, 200 steps, "Harry Potter" held out of the loss.
# Twin of train_170m_control.yaml: identical but for job.name and untaught.
# Submit:  . ./framework/client/sub_builder.sh configs/train_170m_no_harry_potter.yaml

job:
  name: "untaught-no-hp-170m"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"

  # SLURM: https://www.cs.tau.ac.il/system/slurm
  partition: "studentkillable"      # 1 day cap, preemptible
  max_time_minutes: 180
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 64000
  cpus_per_task: 8
  gpus: 1
  constraint: ""                    # any free card: this is a plumbing check

train:
  model: "olmo2_170M"
  init_seed: 12536
  max_duration_value: 200           # smoke only; a real epoch is ~109K steps
  max_duration_unit: "steps"

  # AdamW, cosine schedule with warmup (paper appendix B.4)
  optim_lr: 0.0005
  optim_weight_decay: 0.05
  optim_warmup_steps: 1000
  optim_max_grad_norm: 1.0

  data_global_batch_size: 32768     # tokens per optimizer step
  data_rank_microbatch_size: 8192   # memory knob only; adapt_to_gpu lowers it if needed
  data_seed: 0
  data_num_workers: 4
  data_prefetch_factor: 8

  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: false   # exclusion reads batch["index"], not metadata
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  checkpoint_save_interval: 100
  checkpoint_ephemeral_save_interval: 50
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 1
  cancel_check_interval: 5
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

untaught:
  blacklist: "blacklists/harry_potter.json"  # QIDs; resolved against ES before submission
  case_sensitive: true              # true -> lment_cs index, false -> lment_ci
  threshold_hyperlinks: 1.0         # mention-confidence cutoffs (paper section 5.2, Table 4)
  threshold_entity_linking: 0.6
  threshold_coref: 0.6
  threshold_coref_cluster: 0.6
  enabled: true
  adapt_to_gpu: true                # drop compile / shrink microbatch if the card needs it
  disable_wandb: true
  disable_downstream_eval: true
