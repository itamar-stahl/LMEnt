# TWO EPOCHS. Same ablation, same everything else, twice the passes.
#
# Why 2 and not 1, 4 or 6: measured, not assumed. The authors released 1E/2E/4E/6E
# of this 1B on this corpus, and scoring all four on EMBER (ember_eval/epoch_curve.py)
# shows knowledge of the ablated concept gaining +0.516 nats from 1E to 2E -- the
# second-largest gain of any of the 18 concepts -- and then going backwards: -0.172
# by 4E and -0.131 by 6E, dead last of 18. The corpus is saturated for a 1B after
# two passes. Epoch 2 is where this concept's knowledge lands and nothing after it
# helps, so 2 is the whole of the gain and 4 or 6 would burn GPU-hours to lose ground.
#
# Fresh from random init rather than continuing the finished 1E pair: the +0.516 was
# measured between two *fresh* cosine schedules, and a warm restart of an annealed
# model is a different training regime whose LR spike lets the control relearn what
# the ablated twin cannot. See OPERATIONS.md.
#
# COST AND THE RESUME BOUNDARY -- rewritten 2026-08-29, when the batch went back
# to the authors' 32,768 (see the train block). Until then this header said:
# "54,832 steps at the 1.22 s/step measured on an H100 is ~18.6 h, inside the
# partition's 24 h limit, so one window per twin with no resume boundary." That
# was true of the 131,072-token batch and is not true any more.
#
# The same two epochs are the same tokens and the same FLOPs, but at a quarter
# the batch they are ~219,300 optimizer steps (4 x 54,832 = 219,328) instead of
# 54,832. What grows is the fixed per-step cost -- optimizer step, FSDP
# reduce-scatter, LR scheduler, metrics -- now amortised over a quarter as much
# work. 18.6 h is therefore a floor, not an estimate: 0.1 s of per-step overhead
# alone adds 6.1 h, putting the run past the partition's 24 h limit that the old
# batch was chosen to fit under.
#
# So expect a resume boundary, and on a killable partition expect preemptions on
# top of it. This is a supported path, not a new experiment: resume restores
# model, optimizer, scheduler and dataloader state, resume_from_previous_run is
# already true, and every scheduling field is resume-ignored. But the seam is
# real and the old "one window, no resume" claim is gone rather than quietly
# left standing. Time it before trusting it -- the 0.1 s figure above is an
# illustration, not a measurement. See OPERATIONS.md.
#
# One incidental safety net: kas/train.py names the checkpoint folder after the
# hyperparameters, so these values save into olmo2_1B_0.0003_32768_0.01_2 rather
# than the old olmo2_1B_0.0004_131072_0.05_2. A run at these settings cannot
# silently continue one at the old ones -- and resume_identity would refuse it
# anyway, since optim_lr and the batch are not resume-ignored fields.

job:
  name: "untaught-control-1b-2e"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"
  resume_from_previous_run: true
  mail_user: "galll.barak@gmail.com"   # SLURM emails on the events below;
  mail_type: "END,FAIL,TIME_LIMIT"     # resume-ignored, so it is safe to add mid-run

  account: "gpu-research"           # gpu-h100-killable is gated on the research association
  partition: "gpu-h200"             # moved to the tier-20 partition itself, 2026-09-03 14:00.
                                    # The 12:10 note below was right that killable could not reach
                                    # n-h200's spare capacity, and wrong only about the remedy: the
                                    # answer to being stuck behind tier 20 is to join it, not to leave
                                    # the node. gpu-h200 runs under QOS gpu4, a partition-wide
                                    # GrpTRES cap of 4 GPUs across all users; 3 were held (no-rome 1,
                                    # roiba 2), leaving exactly one, and this job asks for one.
                                    # 
                                    # h100 did not work out. t-100 is shared with gpu-morgeva at a
                                    # higher tier, and when an ordavids1 array plus two ns3 jobs took
                                    # all 8 h100s this job was preempted twice inside 15 minutes
                                    # (13:20:27 and 13:34:22, Restarts=2). The second attempt was
                                    # killed during "Loading metadata" and completed zero steps, so
                                    # the cycle was paying startup cost to make negative progress.
                                    # Slurm's next projected start was 2026-09-04T07:19, ~17.5h out.
                                    # 
                                    # Nothing can preempt this job here. PreemptType is
                                    # preempt/partition_prio, which requires a STRICTLY higher tier,
                                    # and tier 20 is the ceiling on n-h200. Three partitions carry
                                    # this node, not the two "scontrol show node" admits to: it hides
                                    # partitions you have no access to, exactly as it hides
                                    # gpu-morgeva on t-100. "sinfo -a -N -n n-h200" is what lists
                                    # them -- gpu-h200-killable (tier 10), gpu-h200 (tier 20) and
                                    # gpu-ydagan (tier 20). gpu-ydagan competes for the node's idle
                                    # GPUs but cannot preempt at equal tier. No reservations exist in
                                    # the system. Verified 2026-09-03 14:01.
                                    # 
                                    # gpu4 carries DenyOnLimit: if the fourth GPU is taken first,
                                    # sbatch is rejected outright rather than queued, so a submission
                                    # here either lands immediately or fails loudly.
                                    # 
                                    # constraint stays "" -- h200 is what the recorded runs used, and
                                    # naming a card restarts from random init. partition is
                                    # resume-ignored, so this move does not disturb resume identity.
  max_time_minutes: 7200           # the gpu-h200 maximum (5 days).
                                    # Must track the partition: gpu-h200 allows 5 days, killable allows 1.
                                    # Raised from 1440 with the move. Control needs ~62h of run time at
                                    # the rate measured on n-h200 (1.35 s/step over 3h, stalls included)
                                    # for its remaining 164,344 steps, which does not fit 24h or 48h.
                                    # At 5 days it finishes inside one window with no resume boundary.
                                    # --time cannot be raised after submission, so under-asking here
                                    # would cost a resume that this partition does not require.
                                    # Leaving 2880 here after moving back produced 'Requested time limit is
                                    # invalid (missing or exceeds some limit)' and sub_builder printed an
                                    # empty job id rather than the error, so the run looked submitted and
                                    # was not.
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 40000                 # restored from the deliberate 20000 under-request.
                                    # 20000 existed only to squeeze onto a memory-saturated killable node
                                    # when ~21.5 GiB was all that was unallocated. Measured RSS with 12
                                    # dataloader workers is ~36 GiB, so that number was a fiction the
                                    # scheduler happened not to enforce.
                                    # 
                                    # On gpu-h200 there is room (~117 GiB free when this was submitted),
                                    # and at tier 20 this job can displace other people's work -- so what
                                    # it tells the scheduler should be true rather than convenient.
  cpus_per_task: 16                 # raised from 8 alongside data_num_workers 4 -> 12: twelve
                                    # dataloader workers plus the trainer will not fit in eight
                                    # cores, and oversubscribing them would recreate the stall
                                    # this change exists to remove. n-h200 has 192 cores with
                                    # ~132 free, so 16 costs nothing and is not what gates
                                    # scheduling here -- the 8/8 allocated GPUs are.
  gpus: 1                           # not a courtesy: measured at 2.30 s/step against 2.54 for
                                    # four, because FSDP all-gathers every layer and 4 ranks
                                    # leave only 2 microsteps to amortise it. One card is
                                    # faster AND 4.4x cheaper in GPU-hours. See B200.md.
  constraint: ""                    # the partition already contains only h100 nodes, and
                                    # empty is what matches the recorded "h200" runs --
                                    # naming a different card restarts from random init.

train:
  model: "olmo2_1B"
  init_seed: 12536
  max_duration_value: 2               # two epochs; see the header
  max_duration_unit: "epochs"

  # optimizer: AdamW, cosine schedule with warmup. Every value below is the LMEnt
  # authors' own, taken from third_party/OLMo-core/src/examples/kas/kas_config.json -- the
  # config their kas/train.py ran, and the one whose save-folder naming produced
  # the run dir name olmo2_1B_0.0004_131072_0.05_2 we have been reproducing.
  # Adopted wholesale 2026-08-29.
  #
  # What was here before mixed three sources and matched none of them end to end:
  # weight decay 0.05 from paper appendix B.4, LR 4e-4 from neither B.4 (which
  # says 5e-3) nor the shipped artifacts (which say 3e-4), and a 131,072-token
  # batch chosen for throughput. The batch was defended on the grounds that 4x
  # "cost nothing measurable" -- but what was measured was downstream QA
  # accuracy, an instrument that is blind to embedding geometry, which is the one
  # thing this experiment reads out. Evidence from an instrument that cannot see
  # the target is not evidence, so the batch goes back to the authors' value too.
  #
  # See COMPARABILITY.md: the finished 1-epoch and 2-epoch twin pairs were
  # trained at the OLD values, so nothing trained here is weight-comparable to
  # them. That is accepted -- those pairs are the ones whose embeddings came out
  # with no usable geometry.
  optim_lr: 0.0003              # kas_config.json  optim.lr
  optim_weight_decay: 0.01      # kas_config.json  optim.weight_decay
                                # Reaches embeddings.weight ONLY -- kas/train.py passes it as a group
                                # override and leaves AdamW's top-level 0.01 for everything else.
                                # See Untaught/OPERATIONS.md. Do not tune this as a global knob.
  optim_warmup_steps: 1000      # kas_config.json  callbacks.lr_scheduler.warmup_steps
  optim_max_grad_norm: 1.0      # unchanged; kas_config.json grad_clipper agrees

  data_global_batch_size: 32768     # kas_config.json  data_loader.global_batch_size
  data_rank_microbatch_size: 8192   # kas_config.json  trainer.rank_microbatch_size.
                                    # Memory only: 4 microsteps per optimizer step
                                    # instead of 8, same optimizer math either way.
  data_seed: 0
  data_num_workers: 12        # kas_config.json says 4, but that is a PER-RANK figure and the
                              # authors sharded the global batch across several GPUs, so each
                              # of their ranks assembled a fraction of it. This runs on gpus: 1,
                              # so one rank's workers build the whole 32,768-token batch every
                              # step -- and at the authors' batch that is 1.65 batches/s against
                              # the old 131,072-token config's 0.88/s. Every fixed per-batch cost
                              # (index lookup, collation, worker handoff) is now paid 4x as often.
                              #
                              # At 4 workers that starved: the 2026-08-29 01:02 pair alternated
                              # 10-60 s stalls with healthy 1.65 BPS bursts, averaged ~13.6 s/step
                              # against 0.60 s/step in the bursts, and died to a 1200 s DataLoader
                              # timeout. Per token that is 415 us vs the old config's 8.7 us. The
                              # filer was not the problem -- random 8 KB reads measured p50 1.5 ms,
                              # p90 3.9 ms, ~655 IOPS.
  data_prefetch_factor: 16    # 12 x 16 = 192 batches of buffer (~116 s at 1.65 BPS) instead of
                              # 4 x 8 = 32 (~19 s), which was too thin to ride out contention on
                              # a node shared with other users' jobs.
                              #
                              # Neither field touches the data or its order: the global batch
                              # indices are precomputed and cached per (batch size, epoch, seed)
                              # in global_batch_indices_bz32768_epoch1_seed0.npy, so this changes
                              # only how fast batches are assembled, never which ones.

  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: true   # kas_config.json dataset.include_instance_metadata
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  checkpoint_save_interval: 20000    # was 5000, scaled with the 4x step count so
                                     # the run still banks ~11 permanent 1B
                                     # checkpoints rather than ~44. Resume-ignored,
                                     # so it can be retuned between submissions.
  checkpoint_ephemeral_save_interval: 1000   # was 500, then 2000, now 1000. This is the
                                     # preemption-recovery granularity and it
                                     # overwrites, so it costs time rather than
                                     # disk -- 500 would pay that ~439 times.
                                     #
                                     # Cut back from 2000 on 2026-08-29: the 01:02 pair
                                     # died at 05:17 to a 1200 s DataLoader timeout having
                                     # reached only ~700 steps in 2h39m -- an average of
                                     # ~13.6 s/step against the ~0.60 s/step of its healthy
                                     # bursts. At 2000 the first ephemeral save was still
                                     # hours away, so nothing but step0 was ever banked and
                                     # four hours of both twins were lost outright. 1000 is
                                     # ~10 min at healthy speed and still bounds the loss if
                                     # the stalling recurs. Resume-ignored, so retuning it
                                     # does not change the experiment's identity.
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 10
  cancel_check_interval: 25
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

untaught:
  blacklist: null
  enabled: true
  adapt_to_gpu: true
  disable_wandb: true
  disable_downstream_eval: true
