# SMOKE CONTROL RUN: 170M, 200 steps, nothing held out.
# Twin of train_170m_no_harry_potter.yaml: identical but for job.name and untaught.
# Submit:  . ./framework/client/sub_builder.sh configs/train_170m_control.yaml

job:
  # identity and data
  name: "untaught-control-170m"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"

  # SLURM resources: https://www.cs.tau.ac.il/system/slurm
  account: "gpu-research"           # gpu-h100-killable is gated on the research association
  partition: "gpu-h100-killable"    # 1 day cap, preemptible
  max_time_minutes: 180
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 64000
  cpus_per_task: 8
  gpus: 1
  constraint: "h100"                # 80 GiB and native bf16: no microbatch shrink, real compile

train:
  # model and duration
  model: "olmo2_170M"
  init_seed: 12536
  max_duration_value: 200           # smoke only; a real epoch is ~109K steps
  max_duration_unit: "steps"

  # optimizer: AdamW, cosine schedule with warmup (paper appendix B.4)
  optim_lr: 0.0005
  optim_weight_decay: 0.05
  optim_warmup_steps: 1000
  optim_max_grad_norm: 1.0

  # batching, in tokens
  data_global_batch_size: 32768     # tokens per optimizer step
  data_rank_microbatch_size: 8192   # memory knob only; adapt_to_gpu lowers it if needed
  data_seed: 0
  data_num_workers: 4
  data_prefetch_factor: 8

  # dataset construction and VSL curriculum
  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: false   # exclusion reads batch["index"], not metadata
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  # checkpoints, metrics and evaluation
  checkpoint_save_interval: 100
  checkpoint_ephemeral_save_interval: 50
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 1
  cancel_check_interval: 5
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

untaught:
  # the ablation
  blacklist: null                   # nothing held out -- this is the control

  # framework behaviour
  enabled: true
  adapt_to_gpu: true                # drop compile / shrink microbatch if the card needs it
  disable_wandb: true
  disable_downstream_eval: true
