# FULL ABLATED RUN: 170M, one epoch, "Harry Potter" held out of the loss.
#
# Identical to train_170m_control_full.yaml in every field except job.name and
# the untaught block. Same init_seed and same data_seed, so both runs see the
# same chunks in the same order in the same batches -- the only difference is
# that blacklisted chunks contribute no gradient.
#
# Hyperparameters follow the paper (appendix B.4). One epoch is ~109K steps
# (3.6B tokens / 32,768 tokens per step).
#
# Submit BOTH runs with:
#   ./run.sh
# or this one alone with:
#   . ./framework/client/sub_builder.sh configs/train_170m_no_harry_potter_full.yaml
#
# studentkillable caps a job at 1 day and is preemptible, so a full epoch takes
# several submissions. Just run ./run.sh again: each new run folder resumes
# from the newest checkpoint of the previous run of the same job (see
# job.resume_from_previous_run).

# Everything about running this as a job: identity, data locations, and the
# SLURM resources sub_builder.sh writes into job.slurm. No save folder here --
# every submission gets its own runs/<name>_<date>_<time> folder.
job:
  name: "untaught-no-hp-170m-full"
  dataset_paths: "${LMENT_DATASET}/dataset-tokenized/*.npy"
  dataset_cache: "${LMENT_DATASET}/dataset-cache"

  # Pick up where the last run of this job stopped, if it left a checkpoint.
  # A previous run qualifies only if its saved config.yaml matches this one
  # field for field, ignoring the scheduling/checkpointing knobs below -- so a
  # changed seed, curriculum or blacklist starts clean instead of silently
  # continuing a different experiment. false = always start from a random init.
  resume_from_previous_run: true

  # SLURM resources (https://www.cs.tau.ac.il/system/slurm).
  # studentkillable: 1 day maximum, low priority, preemptible.
  # The page states one hard student cap -- "we limit 1 GPU per/job" -- and
  # publishes no CPU/memory ceiling, so these are set generously but within
  # what schedules quickly; asking for more mainly means queueing longer.
  partition: "studentkillable"
  max_time_minutes: 1440          # the partition maximum: 1 day
  nodes: 1
  ntasks: 1
  cpu_mem_mb: 64000
  cpus_per_task: 8
  gpus: 1                         # students are limited to 1 GPU per job
  constraint: "titan_xp"

# Everything the model and the optimizer see.
train:
  model: "olmo2_170M"
  init_seed: 12536

  # One full epoch over the 3.6B-token corpus (~109K steps).
  max_duration_value: 1
  max_duration_unit: "epochs"

  # optimizer: AdamW, cosine schedule with warmup
  optim_lr: 0.0005
  optim_weight_decay: 0.05
  optim_warmup_steps: 1000
  optim_max_grad_norm: 1.0

  # batching, in tokens. rank_microbatch is a memory knob only -- gradient
  # accumulation holds the global batch fixed, so untaught.adapt_to_gpu may
  # lower it to fit a small card without changing the optimizer math.
  data_global_batch_size: 32768
  data_rank_microbatch_size: 8192
  data_seed: 0
  data_num_workers: 4
  data_prefetch_factor: 8

  # dataset construction. include_instance_metadata is false on purpose: chunk
  # exclusion keys off batch["index"], never off the per-chunk entity metadata,
  # so training never touches the 212GB dataset-metadata tree.
  dataset_name: "kas_vsl"
  dataset_max_sequence_length: 2048
  dataset_min_sequence_length: 64
  dataset_include_instance_metadata: false
  vsl_curriculum: "grow_p2"
  vsl_num_cycles: 8
  vsl_balanced: false

  # Checkpoints: permanent every 10,000 steps (~11 per epoch, all kept).
  # The ephemeral one every 500 steps is preemption insurance -- only the
  # newest is kept, and it is what a resubmitted run resumes from, so a kill
  # costs at most ~500 steps instead of up to 10,000.
  checkpoint_save_interval: 10000
  checkpoint_ephemeral_save_interval: 500
  checkpoint_save_async: true
  checkpoint_save_overwrite: true
  metrics_collect_interval: 10
  cancel_check_interval: 25
  wandb_cancel_check_interval: 10
  eval_tasks: ["arc_easy"]
  eval_interval: 100000

# The ablation: hold "Harry Potter" out of the loss.
untaught:
  # A file of Wikidata QIDs, relative to Untaught/. framework.client.prepare
  # resolves it against Elasticsearch before submission and writes the chunk
  # ids into the run folder; the GPU node only ever reads that file.
  blacklist: "blacklists/harry_potter.json"

  # Which index to retrieve from: true -> lment_cs (restored from
  # enwiki_case_sensitive), false -> lment_ci (from enwiki). QID retrieval is
  # case-agnostic, so true is the right default.
  case_sensitive: true

  # Per-source mention-confidence cutoffs; a mention counts if it clears at
  # least one. These are the values the paper validated on a 60-entity dev set
  # (section 5.2, Table 4). Omit one and it keeps its default; an unknown
  # threshold_* name is a hard error.
  threshold_hyperlinks: 1.0
  threshold_entity_linking: 0.6
  threshold_coref: 0.6
  threshold_coref_cluster: 0.6

  enabled: true
  adapt_to_gpu: true
  disable_wandb: true
  disable_downstream_eval: true
