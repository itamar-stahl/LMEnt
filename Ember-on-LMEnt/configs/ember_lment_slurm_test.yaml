# Titan XP end-to-end smoke. The expensive judge is replaced by deterministic
# threshold selection; judge connector behavior is covered by unit tests.
method: ember
model_name: ../../models_symlinks/lment-1b-control-2e
rank: 2
seed: 42

selection:
  mode: threshold
  ratio_thresh: 2.0
  feature_ratio_threshold: 0.0
  judge_confidence_threshold: 0.85
  judge_top_k: 20

ember:
  deltas: [0.5]
  explicit_delta: 0.5

eval:
  data_json: ../data/mc_questions.json
  alpaca: false
  alpaca_split: test
  alpaca_max_items: 1

lment:
  model_key: lment-1b-control-2e-titan-test
  model_device: cuda
  dtype: fp32
  runs_root: ../runs
  data:
    concept_json: ../data/concept_sentences.json
    neutral_json: ../data/neutral_sentences.json
  features:
    cache_root: ../mf_outputs
    reuse: false
    fitting_device: cuda
    max_iterations: 2
    g_sparsity: 1.0
    k_proj: 2
  judge:
    model: null
    revision: null
    device: cuda
    max_new_tokens: 256
    local_files_only: false
    cache_dir: null
  save:
    full_model: false
  execution:
    activate_script: ../activate_env.sh
  slurm:
    job_name: ember-lment-tests
    partition: studentkillable
    constraint: titan_xp
    time_minutes: 240
    cpu_mem_mb: 32000
    cpus_per_task: 8
